{% extends 'base.html' %}

{% block title %}Crear impacto ambiental · AI Footprint{% endblock %}

{% block content %}
<div class="tarjeta formulario-contenedor">
    <h1>Registrar impacto</h1>

    <form method="POST" class="formulario">
        {% csrf_token %}

        {{ form.as_p }}

        <div class="formulario-acciones">
            <button type="submit" class="boton">Guardar impacto</button>
            <a href="{% url 'lista_impactos' %}" class="texto-secundario">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
