{% extends 'base.html' %}

{% block title %}Crear tipo de modelo · AI Footprint{% endblock %}

{% block content %}
<div class="tarjeta formulario-contenedor">
    <h1>Registrar tipo de modelo</h1>

    <form method="POST" class="formulario">
        {% csrf_token %}

        {{ form.as_p }}

        <div class="formulario-acciones">
            <button type="submit" class="boton">Guardar tipo de modelo</button>
            <a href="{% url 'lista_tipos' %}" class="texto-secundario">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
