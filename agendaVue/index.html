<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Agenda de contactos</title>
	<meta name="description" content="Agenda de contactos hecha con Vue: consulta, añade y borra contactos con su nombre, email y teléfono.">
	<link rel="stylesheet" href="css/estilos.css">

	<!-- JSON-LD (web de datos): describe la aplicación con el vocabulario de schema.org -->
	<script type="application/ld+json">
	{
		"@context": "https://schema.org",
		"@type": "WebApplication",
		"name": "Agenda de contactos",
		"description": "Agenda de contactos hecha con Vue: consulta, añade y borra contactos con su nombre, email y teléfono.",
		"applicationCategory": "UtilitiesApplication",
		"operatingSystem": "Cualquiera con navegador web",
		"browserRequirements": "Requiere JavaScript",
		"inLanguage": "es",
		"offers": {
			"@type": "Offer",
			"price": "0",
			"priceCurrency": "EUR"
		},
		"author": {
			"@type": "Organization",
			"name": "Grupo IW-BI-04",
			"member": [
				{ "@type": "Person", "name": "Eneko" },
				{ "@type": "Person", "name": "Jürgen" },
				{ "@type": "Person", "name": "Miguel" },
				{ "@type": "Person", "name": "Andoni" },
				{ "@type": "Person", "name": "Cesar" }
			]
		}
	}
	</script>

	<!-- JSON-LD con la lista de contactos: js/app.js lo actualiza al añadir o borrar -->
	<script type="application/ld+json" id="ld-contactos">
	{
		"@context": "https://schema.org",
		"@type": "ItemList",
		"name": "Contactos de la agenda",
		"numberOfItems": 0,
		"itemListElement": []
	}
	</script>
</head>
<body>
	<header class="cabecera">
		<h1>Agenda de contactos</h1>
		<p>Guarda el nombre, el email y el teléfono de tus contactos.</p>
	</header>

	<main class="contenido">
		<noscript>
			<p class="aviso">Esta agenda necesita JavaScript activado para funcionar.</p>
		</noscript>
		<!-- Aquí Vue dibuja la agenda usando la plantilla "plantilla-agenda" -->
		<div id="app"></div>
	</main>

	<!-- RDFa: datos del grupo autor marcados con el vocabulario de schema.org -->
	<footer class="pie" vocab="https://schema.org/" typeof="Organization">
		<p>Hecho por <span property="name">Grupo IW-BI-04</span> · <span property="description">Práctica de Ingeniería Web, entrega E4b</span></p>
		<p>Integrantes:
			<span property="member" typeof="Person"><span property="name">Eneko</span></span>,
			<span property="member" typeof="Person"><span property="name">Jürgen</span></span>,
			<span property="member" typeof="Person"><span property="name">Miguel</span></span>,
			<span property="member" typeof="Person"><span property="name">Andoni</span></span> y
			<span property="member" typeof="Person"><span property="name">Cesar</span></span>
		</p>
	</footer>

	<!--
		Plantilla de Vue. Va dentro de un <script type="text/x-template"> para que
		el validador del W3C no revise las directivas de Vue (v-model, v-for, @click...),
		que no son atributos HTML válidos. Vue la lee y la convierte en HTML normal.
	-->
	<script type="text/x-template" id="plantilla-agenda">
		<div class="agenda">

			<section class="tarjeta" aria-labelledby="titulo-nuevo">
				<h2 id="titulo-nuevo">Nuevo contacto</h2>

				<form class="formulario" novalidate @submit.prevent="guardarContacto">
					<div class="campo">
						<label for="nombre">Nombre</label>
						<input id="nombre" type="text" v-model.trim="nuevo.nombre"
							:class="{ 'campo-error': errores.nombre }"
							autocomplete="name" maxlength="60" placeholder="Ej.: Ana López" required>
						<p v-if="errores.nombre" class="mensaje-error">{{ errores.nombre }}</p>
					</div>

					<div class="campo">
						<label for="email">Email</label>
						<input id="email" type="email" v-model.trim="nuevo.email"
							:class="{ 'campo-error': errores.email }"
							autocomplete="email" maxlength="80" placeholder="Ej.: ana@ejemplo.com" required>
						<p v-if="errores.email" class="mensaje-error">{{ errores.email }}</p>
					</div>

					<div class="campo">
						<label for="telefono">Teléfono</label>
						<input id="telefono" type="tel" v-model.trim="nuevo.telefono"
							:class="{ 'campo-error': errores.telefono }"
							autocomplete="tel" maxlength="20" placeholder="Ej.: 600 123 456" required>
						<p v-if="errores.telefono" class="mensaje-error">{{ errores.telefono }}</p>
					</div>

					<button type="submit" class="boton boton-anadir" :disabled="!formularioRelleno">Añadir contacto</button>
					<p v-if="mensaje" class="mensaje-ok" role="status">{{ mensaje }}</p>
				</form>
			</section>

			<section class="tarjeta" aria-labelledby="titulo-lista">
				<h2 id="titulo-lista">Mis contactos <span class="contador">({{ textoContador }})</span></h2>

				<p v-if="contactos.length === 0" class="vacio">No hay contactos. Añade el primero con el formulario.</p>

				<!-- Microdata: cada contacto se marca como una persona (schema.org/Person) -->
				<ul v-else class="lista-contactos">
					<li v-for="(contacto, indice) in contactos" :key="contacto.id" class="contacto"
						itemscope itemtype="https://schema.org/Person">
						<div class="datos">
							<span class="nombre" itemprop="name">{{ contacto.nombre }}</span>
							<a class="email" :href="'mailto:' + contacto.email"><span itemprop="email">{{ contacto.email }}</span></a>
							<a class="telefono" :href="enlaceTelefono(contacto.telefono)"><span itemprop="telephone">{{ contacto.telefono }}</span></a>
						</div>
						<button type="button" class="boton boton-borrar"
							:aria-label="'Borrar a ' + contacto.nombre"
							@click="borrarContacto(indice)">Borrar</button>
					</li>
				</ul>
			</section>

		</div>
	</script>

	<script src="js/vue.js"></script>
	<script src="js/app.js"></script>
</body>
</html>
